<link rel="apple-touch-icon" href="/icon-512.png">
<meta name="theme-color" content="#111">

<style>
:root{
  --bg:#f6f5f0;--surface:#fff;--surface2:#f0eeea;
  --border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.13);
  --text:#111;--text2:#555;--text3:#999;
  --up:#c0392b;--dn:#27ae60;--blue:#1d4ed8;--gold:#92670a;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Noto Sans TC',sans-serif;color:var(--text);max-width:430px;margin:0 auto;display:flex;flex-direction:column;height:100%}
.app{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* HEADER */
.hd{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px 0;position:relative;z-index:50;flex-shrink:0}
.hd-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;letter-spacing:-.5px}
.logo em{color:var(--up);font-style:normal}
.live{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);font-family:'Space Mono',monospace;cursor:pointer}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dn);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.acct-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.acct-tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);transition:.15s}
.tab.on{background:var(--text);color:#fff;border-color:transparent}

/* CONTENT */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page{padding:16px;display:none}
.page.on{display:block}

/* NAV */
.nav{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:500;transition:.15s;border:none;background:none}
.nb i{font-size:21px}
.nb.on{color:var(--text)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.card.cp{cursor:pointer}
.card.cp:active{transform:scale(.99)}
.card.acc-up{border-left:3px solid var(--up)}
.card.acc-dn{border-left:3px solid var(--dn)}
.card.acc-bl{border-left:3px solid var(--blue)}
.card.acc-gd{border-left:3px solid var(--gold)}

/* INDEX STRIP */
.idx-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:14px}
.idx-strip::-webkit-scrollbar{display:none}
.idx{flex-shrink:0;min-width:115px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.idx-n{font-size:10px;color:var(--text3);font-weight:500;margin-bottom:2px}
.idx-v{font-family:'Space Mono',monospace;font-size:15px;font-weight:700}
.idx-c{font-size:11px;margin-top:1px;font-family:'Space Mono',monospace}

/* STOCK ROW */
.sr{display:flex;justify-content:space-between;align-items:flex-start}
.sl h3{font-size:15px;font-weight:700}
.sl .meta{font-size:11px;color:var(--text3);margin-top:2px}
.sr-r{text-align:right}
.price{font-family:'Space Mono',monospace;font-size:17px;font-weight:700}
.chg{font-size:11px;font-family:'Space Mono',monospace;margin-top:2px}
.roi{font-size:12px;margin-top:2px;font-weight:500}
.up{color:var(--up)}.dn{color:var(--dn)}.neu{color:var(--text3)}

/* TAGS */
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;margin-top:6px}
.t-hold{background:#fef9e7;color:#92670a}
.t-buy {background:#ecfdf5;color:#166534}
.t-sell{background:#fef2f2;color:#991b1b}
.t-add {background:#eff6ff;color:#1e40af}
.t-watch{background:#f3f4f6;color:#374151}
.t-stop{background:#fef2f2;color:#991b1b}

/* SECTION TITLE */
.st{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sa{font-size:12px;color:var(--blue);font-weight:500;text-transform:none;letter-spacing:0;cursor:pointer}

/* OPENING CARD */
.op-card{background:var(--text);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.op-card::before{content:'';position:absolute;right:-20px;top:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.05)}
.op-lbl{font-size:10px;opacity:.5;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.op-v{font-size:18px;font-weight:700;margin-bottom:6px}
.op-r{font-size:12px;opacity:.7;line-height:1.7}

/* SUM GRID */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sc{background:var(--surface2);border-radius:10px;padding:12px}
.sc-l{font-size:11px;color:var(--text3)}
.sc-v{font-size:16px;font-weight:700;margin-top:3px;font-family:'Space Mono',monospace}

/* SCORE BAR */
.sb{display:flex;align-items:center;gap:8px;margin-top:8px}
.sb-track{flex:1;height:3px;background:var(--surface2);border-radius:2px}
.sb-fill{height:3px;border-radius:2px;transition:width .6s ease}
.sb-n{font-size:12px;font-weight:700;font-family:'Space Mono',monospace;width:24px;text-align:right}

/* NEWS */
.ni{padding:12px 0;border-bottom:1px solid var(--border)}
.ni:last-child{border-bottom:none}
.ni-s{font-size:10px;color:var(--text3);margin-bottom:3px;font-weight:500}
.ni-t{font-size:13px;line-height:1.55}
.ni-time{font-size:10px;color:var(--text3);margin-top:3px}
.chip{background:var(--surface2);padding:1px 6px;border-radius:8px;font-size:10px}

/* ALERT */
.ar{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.ar:last-child{border-bottom:none}
.toggle{width:38px;height:21px;background:#ddd;border-radius:11px;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.toggle.on{background:var(--text)}
.toggle::after{content:'';position:absolute;left:2px;top:2px;width:17px;height:17px;background:#fff;border-radius:9px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:19px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:8px 20px 32px;width:100%;max-width:430px}
.handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 18px}
.fl{margin-bottom:14px}
.fl label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}
.fi,.fs{width:100%;padding:11px 14px;border:1px solid var(--border2);border-radius:10px;font-size:15px;background:var(--surface);font-family:inherit;color:var(--text);-webkit-appearance:none}
.fi:focus,.fs:focus{outline:none;border-color:var(--text)}
.btn{width:100%;padding:14px;background:var(--text);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px}
.btn-o{width:100%;padding:12px;background:transparent;color:var(--text3);border:1px solid var(--border2);border-radius:12px;font-size:14px;cursor:pointer;font-family:inherit;margin-top:8px}
.stock-list{max-height:200px;overflow-y:auto;border:1px solid var(--border2);border-radius:10px;margin-top:4px;background:var(--surface)}
.stock-item{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);font-size:13px}
.stock-item:last-child{border-bottom:none}
.stock-item:active{background:var(--surface2)}
.stock-item .si-name{font-weight:500}
.stock-item .si-code{color:var(--text3);font-family:'Space Mono',monospace;font-size:11px}
.stock-item .si-type{font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600}
.si-stock{background:#fef2f2;color:#991b1b}
.si-etf{background:#eff6ff;color:#1e40af}
.search-wrap{position:relative}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text3);font-size:14px;display:none}

/* DETAIL */
.det-hd{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;cursor:pointer;border-bottom:1px solid var(--border);background:var(--surface)}
.det-hd i{font-size:20px;color:var(--text2)}
.det-hd span{font-size:15px;font-weight:600}
.big{font-family:'Space Mono',monospace;font-size:36px;font-weight:700}

/* LOADING STATES */
.sk{background:linear-gradient(90deg,var(--surface2) 25%,var(--bg) 50%,var(--surface2) 75%);background-size:400% 100%;animation:sk 1.2s infinite;border-radius:6px;height:16px;display:inline-block}
@keyframes sk{0%{background-position:100%}100%{background-position:-100%}}
.api-warn{background:#fefce8;border:1px solid #fde047;border-radius:10px;padding:10px 14px;font-size:12px;color:#713f12;margin-bottom:12px;line-height:1.6}
</style>
</head>

// ─── AI 請求排隊(避免同時太多請求打爆 Groq)──────────────
const _aiQueue = [];
let _aiRunning = 0;
const _AI_CONCURRENCY = 2; // 最多同時 2 個請求

function callAI(prompt, onResult, onError) {
  _aiQueue.push({ prompt, onResult, onError });
  _processAIQueue();
}

function _processAIQueue() {
  while (_aiRunning < _AI_CONCURRENCY && _aiQueue.length > 0) {
    const task = _aiQueue.shift();
    _aiRunning++;
    _callAISingle(task.prompt, task.onResult, task.onError).finally(function() {
      _aiRunning--;
      _processAIQueue();
    });
  }
}

async function _callAISingle(prompt, onResult, onError, retries) {
  retries = retries || 0;
  try {
    const r = await fetch('/api/claude', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({prompt}),
      signal: AbortSignal.timeout(25000),
    });
    if (r.status === 429 && retries < 3) {
      // Rate limit - 等待後重試
      await new Promise(function(res){ setTimeout(res, 2000 * (retries + 1)); });
      return _callAISingle(prompt, onResult, onError, retries + 1);
    }
    if (!r.ok) { console.error('callAI HTTP', r.status); onError && onError(); return; }
    const d = await r.json();
    if (d.ok && d.text) { onResult(d.text); }
    else { console.error('callAI no text:', d); onError && onError(); }
  } catch(e) {
    if (retries < 2) {
      await new Promise(function(res){ setTimeout(res, 1500); });
      return _callAISingle(prompt, onResult, onError, retries + 1);
    }
    console.error('callAI error:', e);
    onError && onError();
  }
}

// ─── PRICE FETCHING ─────────────────────────────────────────
// 優先使用 /api/prices(Vercel serverless)，若不可用則直接呼叫 TWSE(盤後)
async function fetchPrices() {
  S.loading = true;
  setDot('loading');

  try {
    // 收集所有帳戶的持股代碼，傳給後端動態查詢
    const allCodes = new Set();
    Object.values(PF).forEach(acc => {
      (acc.stocks || []).forEach(s => allCodes.add(s.code));
    });
    const codesParam = allCodes.size > 0 ? '?codes=' + [...allCodes].join(',') : '';

    // 嘗試 Vercel serverless function
    const r = await fetch('/api/prices' + codesParam, {signal: AbortSignal.timeout(15000)});
    if (r.ok) {
      const json = await r.json();
      if (json.data && Object.keys(json.data).length > 0) {
        S.prices = json.data;
        S.pricesOk = true;
        S.loading = false;
        S.lastUpd = new Date();
        setDot('ok');
        checkAlerts();
        return;
      }
    }
  } catch(e) { console.log('api/prices error:', e); }

  // Fallback：直接呼叫 TWSE OpenAPI(無需 proxy，CORS 對部分瀏覽器開放)
  try {
    const r = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_AVG_ALL', {
      signal: AbortSignal.timeout(10000)
    });
    if (r.ok) {
      const data = await r.json();
      if (Array.isArray(data)) {
        data.forEach(item => {
          const code  = item.Code?.trim();
          const price = parseFloat(item.ClosingPrice?.replace(/,/g,''));
          const avg   = parseFloat(item.MonthlyAveragePrice?.replace(/,/g,''));
          if (code && !isNaN(price)) {
            const change    = isNaN(avg) ? 0 : +(price - avg).toFixed(2);
            const changePct = (!isNaN(avg) && avg !== 0) ? +((price-avg)/avg*100).toFixed(2) : 0;
            S.prices[code] = {price, change, changePct, name:item.Name, ok:true};
          }
        });
        S.loading = false;
        S.lastUpd = new Date();
        setDot('ok');
        checkAlerts();
        return;
      }
    }
  } catch {}

  // 最終 fallback：API 都不可用(本地開發環境常見)
  S.loading = false;
  setDot('err');
}

function setDot(state) {
  const dot = document.getElementById('dot');
  const upd = document.getElementById('upd');
  if (state === 'loading') { dot.style.background='#f59e0b'; upd.textContent='更新中...'; return; }
  if (state === 'err')     { dot.style.background='#ef4444'; upd.textContent='API離線'; return; }
  dot.style.background = '#22c55e';
  if (S.lastUpd) {
    const h = S.lastUpd.getHours().toString().padStart(2,'0');
    const m = S.lastUpd.getMinutes().toString().padStart(2,'0');
    const s = S.lastUpd.getSeconds().toString().padStart(2,'0');
    upd.textContent = `${h}:${m}:${s}`;
  }
}

function gP(code) { return S.prices[code] || null; }

function fmtN(n) {
  if (n == null || isNaN(n)) return '---';
  return n.toLocaleString('zh-TW', {maximumFractionDigits:2, minimumFractionDigits:2});
}

function fmtChg(c, p) {
  if (c == null || !isFinite(c)) return '<span class="neu">---</span>';
  const s = c >= 0 ? '+' : '', cls = c >= 0 ? 'up' : 'dn';
  return `<span class="${cls}">${s}${c.toFixed(2)} (${s}${(p||0).toFixed(2)}%)</span>`;
}

function checkAlerts() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const acc = PF[S.acct] || {};
  (acc.stocks||[]).forEach(s => {
    const key = S.acct+'_'+s.code;
    if (!S.alerts[key] || !S.alertPrices[key]) return;
    const target = parseFloat(S.alertPrices[key]);
    const p = gP(s.code);
    if (!p || isNaN(target)) return;
    if (Math.abs(p.price - target) / target < 0.02) {
      new Notification(`📈 到價：${s.name}`, {body:`現價 $${fmtN(p.price)} 接近目標 $${target}`});
    }
  });
}

          <div style="font-size:9px;color:var(--text3);font-weight:600;margin-bottom:3px">🎯 結論</div>
          <div id="thermo-conclusion" style="font-size:11px;font-weight:600;line-height:1.5">⏳ 載入中...</div>
        </div>
      </div>
    </div>

    <div class="sg">
      <div class="sc"><div class="sc-l">帳戶市值</div><div class="sc-v" style="font-size:13px;">NT$${Math.round(tv).toLocaleString()}</div></div>
      <div class="sc"><div class="sc-l">總損益</div><div class="sc-v ${roi>=0?'up':'dn'}">${roi>=0?'+':''}${roi}%</div></div>
    </div>
    <div class="st">各帳戶損益 <span class="sa" onclick="go('portfolio')">持倉 →</span></div>
    ${(() => {
      // 計算全體總損益
      let totalV = 0, totalC = 0;
      ACCOUNTS.forEach(a => {
        const ac = PF[a.id] || {};
        (ac.stocks||[]).forEach(s => {
          const p = gP(s.code);
          totalV += (p?.price ?? s.cost) * s.qty;
          totalC += s.cost * s.qty;
        });
        (ac.funds||[]).forEach(f => { totalV += f.nav*f.units; totalC += f.cost; });
      });
      const totalRoi = totalC > 0 ? ((totalV-totalC)/totalC*100).toFixed(1) : 0;
      const totalPnl = Math.round(totalV - totalC);
      const totalCls = totalPnl >= 0 ? 'up' : 'dn';

      // 各帳戶損益列
      const rows = ACCOUNTS.map(a => {
        const ac = PF[a.id] || {};
        let av=0, ac2=0;
        (ac.stocks||[]).forEach(s => {
          const p = gP(s.code);
          av += (p?.price ?? s.cost) * s.qty;
          ac2 += s.cost * s.qty;
        });
        (ac.funds||[]).forEach(f => { av += f.nav*f.units; ac2 += f.cost; });
        if (ac2 === 0) return '';
        const roi = ((av-ac2)/ac2*100).toFixed(1);
        const pnl = Math.round(av - ac2);
        const cls = pnl >= 0 ? 'up' : 'dn';
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)">
          <div style="font-size:13px;font-weight:500">${a.e} ${a.name}</div>
          <div style="text-align:right">
            <span style="font-size:13px;font-weight:700;font-family:'Space Mono',monospace" class="${cls}">${roi>=0?'+':''}${roi}%</span>
            <span style="font-size:11px;color:var(--text3);margin-left:6px">${pnl>=0?'+':''}NT$${Math.abs(pnl).toLocaleString()}</span>
          </div>
        </div>`;
      }).filter(Boolean).join('');

      return `<div class="card" style="padding:0 16px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px solid var(--border2)">
          <div style="font-size:13px;font-weight:700">💰 全體總損益</div>
          <div style="text-align:right">
            <span style="font-size:18px;font-weight:700;font-family:'Space Mono',monospace" class="${totalCls}">${totalRoi>=0?'+':''}${totalRoi}%</span>
            <div style="font-size:11px;color:var(--text3);margin-top:1px">${totalPnl>=0?'+':''}NT$${Math.abs(totalPnl).toLocaleString()}</div>
          </div>
        </div>
        ${rows || '<div style="padding:12px 0;font-size:13px;color:var(--text3)">尚無持倉資料</div>'}
      </div>`;
    })()}
  `;

  // ── 台股燈號 AI 分析 ──────────────────────────────────────────
  setTimeout(function() {
    if (!sp500 && !taiex) return;
    var tomorrow = new Date();
    var _h=tomorrow.getHours(),_m=tomorrow.getMinutes(); if(_h>21||(_h===21&&_m>=30)) tomorrow.setDate(tomorrow.getDate()+1);
    var tomorrowStr = tomorrow.getFullYear()+'年'+(tomorrow.getMonth()+1)+'月'+tomorrow.getDate()+'日';

    // 靜態機率計算
    var spPct  = sp500?.changePct  || 0;
    var soxPct = sox?.changePct    || 0;
    var tsmPct = tsm?.changePct    || 0;
    var score  = spPct*0.4 + soxPct*0.35 + tsmPct*0.25;
    var openP  = Math.min(85, Math.max(20, Math.round(55 + score*8)));
    var redP   = Math.min(82, Math.max(18, Math.round(52 + score*7)));

    var opEl = document.getElementById('open-prob');
    var rdEl = document.getElementById('red-prob');
    var lgEl = document.getElementById('signal-light');
    var bgEl = document.getElementById('signal-badge');
    if (opEl) opEl.textContent = openP + '%';
    if (rdEl) rdEl.textContent = redP + '%';
    if (lgEl && bgEl) {
      if (score > 0.5)       { lgEl.style.background='#22c55e'; bgEl.textContent='🟢 偏多'; }
      else if (score > 0)    { lgEl.style.background='#86efac'; bgEl.textContent='🟡 中性偏多'; }
      else if (score > -0.5) { lgEl.style.background='#fbbf24'; bgEl.textContent='🟡 中性偏空'; }
      else                   { lgEl.style.background='#ef4444'; bgEl.textContent='🔴 偏空'; }
    }

    // ── 抓 TWSE 產業漲跌幅 ──────────────────────────────────────
    var mktData = 'S&P500:'+(spPct>=0?'+':'')+spPct.toFixed(2)+'% 費半:'+(soxPct>=0?'+':'')+soxPct.toFixed(2)+'% 台積電ADR:'+(tsmPct>=0?'+':'')+tsmPct.toFixed(2)+'% 加權:'+(taiex?(taiex.changePct>=0?'+':'')+taiex.changePct.toFixed(2)+'%':'—');

    // 從 TWSE 抓即時產業熱力資料
    (async function() {
      var topEl = document.getElementById('top-sectors');
      var wkEl  = document.getElementById('weak-sectors');
      var stEl  = document.getElementById('today-strategy');

      try {
        // 抓大盤各類指數(含產業別漲跌)
        var r = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/MI_INDEX20', {
          signal: AbortSignal.timeout(8000)
        });
        var sectorData = [];

        if (r.ok) {
          var data = await r.json();
          // 每筆：{ Index: '電機機械', Change: '0.50', Direction: '+' }
          data.forEach(function(item) {
            var name = item.Index || item.指數名稱 || '';
            var chg  = parseFloat((item.Change || item.漲跌點數 || '0').replace(/,/g,''));
            var dir  = (item.Direction || item.漲跌 || '+');
            var pct  = parseFloat((item.ChangePercent || item.漲跌百分比 || '0').replace(/[+\-%]/g,''));
            if (!name || name === '加權股價指數' || name === '未含金融保險股指數') return;
            sectorData.push({
              name: name,
              pct:  dir === '-' ? -pct : pct,
              chg:  dir === '-' ? -chg : chg
            });
          });
        }

        // 若 MI_INDEX20 失敗，嘗試 twse sector API
        if (!sectorData.length) {
          var r2 = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_d', {
            signal: AbortSignal.timeout(6000)
          });
          // fallback：用 AI 分析
        }

        if (sectorData.length >= 3) {
          // 排序：強→弱
          sectorData.sort(function(a,b){ return b.pct - a.pct; });
          var top10  = sectorData.slice(0, 10);
          var weak10 = sectorData.slice(-10).reverse();

          var nums = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];

          function makeSectorRow(item, idx, isTop) {
            var color  = isTop ? '#86efac' : '#fca5a5';
            var pctStr = (item.pct >= 0 ? '+' : '') + item.pct.toFixed(2) + '%';
            var sid    = 'sector-stocks-' + (isTop?'t':'w') + idx;
            return '<div style="margin-bottom:4px">'
              + '<div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0" onclick="toggleSectorStocks(\'' + sid + '\')">'
              + '<span>' + nums[idx] + ' ' + item.name + '</span>'
              + '<span style="color:' + color + ';font-family:monospace;font-size:10px">' + pctStr + ' ▾</span>'
              + '</div>'
              + '<div id="' + sid + '" class="sector-detail" style="display:none;padding:4px 0 4px 12px;font-size:10px;opacity:.8" data-sector="' + item.name + '">載入中...</div>'
              + '</div>';
          }

          if (topEl) topEl.innerHTML = top10.map(function(t,i){ return makeSectorRow(t,i,true); }).join('');
          if (wkEl)  wkEl.innerHTML  = weak10.map(function(t,i){ return makeSectorRow(t,i,false); }).join('');

          // AI 只負責策略
          var sectorSummary = '今日強勢產業：'+top10.slice(0,5).map(function(t){return t.name+'('+(t.pct>=0?'+':'')+t.pct.toFixed(2)+'%)';}).join('、')
            +'；弱勢產業：'+weak10.slice(0,3).map(function(t){return t.name+'('+(t.pct>=0?'+':'')+t.pct.toFixed(2)+'%)';}).join('、');
          var sigPrompt = getPrompt('signal').replace('{date}', tomorrowStr).replace('{mktData}', mktData + ' ' + sectorSummary);
          callAI(sigPrompt, function(text) {
            try {
              var jsonStr = text.replace(/```json|```/g,'').trim();
              var jsonMatch = jsonStr.match(/\{[\s\S]*\}/);
              var d = jsonMatch ? JSON.parse(jsonMatch[0]) : null;
              if (stEl && d && d.strategy) stEl.innerHTML = d.strategy.map(function(t){return '<div>✓ '+t+'</div>';}).join('');
            } catch(e) {
              if (stEl) stEl.innerHTML = '<span style="opacity:.6">⚠️ 策略分析失敗</span>';
            }
          });

        } else {
          // TWSE 抓不到，回退 AI 完整分析
          var sigPrompt2 = getPrompt('signal').replace('{date}', tomorrowStr).replace('{mktData}', mktData);
          callAI(sigPrompt2, function(text) {
            try {
              var jsonStr = text.replace(/```json|```/g,'').trim();
              var jsonMatch = jsonStr.match(/\{[\s\S]*\}/);
              if (!jsonMatch) throw new Error('no json');
              var d = JSON.parse(jsonMatch[0]);
              if (topEl && d.top)      topEl.innerHTML  = d.top.map(function(t,i){return '<div>'+(['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]||'·')+' '+t+'</div>';}).join('');
              if (wkEl  && d.weak)     wkEl.innerHTML   = d.weak.map(function(t,i){return '<div>'+(['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]||'·')+' '+t+'</div>';}).join('');
              if (stEl  && d.strategy) stEl.innerHTML   = d.strategy.map(function(t){return '<div>✓ '+t+'</div>';}).join('');
            } catch(e) {
              if (stEl)  stEl.innerHTML  = '<span style="opacity:.6">⚠️ 分析失敗，請重新整理</span>';
              if (topEl) topEl.innerHTML = '<span style="opacity:.6">—</span>';
              if (wkEl)  wkEl.innerHTML  = '<span style="opacity:.6">—</span>';
            }
          });
        }
      } catch(e) {
        if (topEl) topEl.innerHTML = '<span style="opacity:.6">⚠️ 載入失敗</span>';
        if (wkEl)  wkEl.innerHTML  = '<span style="opacity:.6">—</span>';
      }
    })();
  }, 500);

  // ── 市場溫度計 AI 分析 ──────────────────────────────────────
  setTimeout(function() {
    if (!taiex && !sp500) return;
    var taiexStr  = taiex  ? taiex.price.toFixed(0)+'點('+(taiex.changePct>=0?'+':'')+taiex.changePct.toFixed(2)+'%)' : '—';
    var taiexChg  = taiex  ? (taiex.changePct>=0?'+':'')+taiex.changePct.toFixed(2)+'%' : '—';
    var tsmcStr   = tsmc   ? '$'+tsmc.price.toFixed(0) : '—';
    var tsmcChg   = tsmc   ? (tsmc.changePct>=0?'+':'')+tsmc.changePct.toFixed(2)+'%' : '—';
    var nasdaqChg = nasdaq ? (nasdaq.changePct>=0?'+':'')+nasdaq.changePct.toFixed(2)+'%' : '—';
    var nasdaqStr = nasdaq ? nasdaq.price.toFixed(0) : '—';
    var soxStr    = sox    ? (sox.changePct>=0?'+':'')+sox.changePct.toFixed(2)+'%' : '—';

    var thermoPrompt = getPrompt('thermo')
      .replace('{taiex}', taiexStr)
      .replace('{taiex_change}', taiexChg)
      .replace('{tsmc}', tsmcStr)
      .replace('{tsmc_change}', tsmcChg)
      .replace('{nasdaq}', nasdaqStr)
      .replace('{nasdaq_change}', nasdaqChg)
      .replace('{sox}', sox ? sox.price.toFixed(0) : '—')
      .replace('{sox_change}', soxStr);

    callAI(thermoPrompt, function(text) {
      // 解析溫度數字
      var scoreMatch = text.match(/市場溫度[：:]\s*(\d+)/);
      var score = scoreMatch ? parseInt(scoreMatch[1]) : 50;
      score = Math.min(100, Math.max(0, score));

      // 解析市場情緒
      var labelMatch = text.match(/市場情緒[：:]\s*(.+)/);
      var label = labelMatch ? labelMatch[1].trim() : '—';

      // 解析資金流向
      var flowMatch = text.match(/資金流向[：:]\s*(.+)/);
      var flow = flowMatch ? flowMatch[1].trim() : '—';

      // 解析風險等級
      var riskMatch = text.match(/風險等級[：:]\s*(.+)/);
      var risk = riskMatch ? riskMatch[1].trim() : '—';

      // 解析結論
      var conclusionMatch = text.match(/結論[：:]\s*([^\n]+)/);
      var conclusion = conclusionMatch ? conclusionMatch[1].trim() : '—';

      // 顏色判斷
      var scoreColor = score >= 81 ? '#ef4444' : score >= 61 ? '#f97316' : score >= 41 ? '#facc15' : score >= 21 ? '#22c55e' : '#3b82f6';
      var riskColor  = risk.includes('高') ? '#ef4444' : risk.includes('中') ? '#f97316' : '#22c55e';

      // 更新 DOM
      var needle = document.getElementById('thermo-needle');
      var scoreEl = document.getElementById('thermo-score');
      var labelEl = document.getElementById('thermo-label');
      var riskEl  = document.getElementById('thermo-risk');
      var flowEl  = document.getElementById('thermo-flow');
      var concEl  = document.getElementById('thermo-conclusion');
      var timeEl  = document.getElementById('thermo-time');

      if (needle) needle.style.left = score + '%';
      if (scoreEl) { scoreEl.textContent = score; scoreEl.style.color = scoreColor; }
      if (labelEl) { labelEl.textContent = label; labelEl.style.color = scoreColor; }
      if (riskEl)  riskEl.innerHTML = '⚠️ 風險：<span style="font-weight:700;color:'+riskColor+'">'+risk+'</span>';
      if (flowEl)  flowEl.textContent = flow;
      if (concEl)  concEl.textContent = conclusion;
      if (timeEl)  { var now=new Date(); timeEl.textContent = (now.getHours().toString().padStart(2,'0'))+':'+(now.getMinutes().toString().padStart(2,'0'))+' 更新'; }
    }, function() {
      var labelEl = document.getElementById('thermo-label');
      if (labelEl) labelEl.textContent = '分析暫不可用';
    });
  }, 1000);
}

function renderPortfolio() {
  const acc = PF[S.acct] || {stocks:[],funds:[]};
  const stocks = (acc.stocks||[]).filter(s=>s.type==='stock');
  const etfs   = (acc.stocks||[]).filter(s=>s.type==='etf');
  const funds  = acc.funds || [];
  // 計算本帳戶總損益
  let ptv=0, ptc=0;
  (acc.stocks||[]).forEach(s => {
    const p = gP(s.code);
    ptv += (p?.price ?? s.cost) * s.qty;
    ptc += s.cost * s.qty;
  });
  (acc.funds||[]).forEach(f => { ptv += f.nav*f.units; ptc += f.cost; });
  const proi = ptc > 0 ? ((ptv-ptc)/ptc*100).toFixed(1) : 0;
  const ppnl = Math.round(ptv - ptc);

  document.getElementById('p-portfolio').innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:2px">帳戶總市值</div>
        <div style="font-size:16px;font-weight:700;font-family:'Space Mono',monospace">NT$${Math.round(ptv).toLocaleString()}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:var(--text3);margin-bottom:2px">未實現損益</div>
        <div style="font-size:20px;font-weight:700;font-family:'Space Mono',monospace" class="${pcls}">${proi>=0?'+':''}${proi}%</div>

    <div class="st">個股 (${stocks.length}) <span class="sa" onclick="openAddModal()">＋ 新增</span></div>

    <div class="st" style="margin-top:8px">ETF (${etfs.length})</div>
    ${etfs.length ? etfs.map(s=>stockCard(s,true,true)).join('') : '<div style="color:var(--text3);font-size:13px;padding:8px 0">尚無ETF</div>'}
    <div class="st" style="margin-top:8px">基金 (${funds.length})</div>
    ${funds.length ? funds.map(f=>{
      const mv   = f.nav * f.units;

        <div class="sr">
          <div class="sl">
            <h3 style="font-size:14px;padding-right:24px">${f.name}</h3>
            <div class="meta" style="display:flex;align-items:center;gap:6px;margin-top:2px">
              淨值
              <input type="number" value="${f.nav}"
                style="width:72px;border:1px solid var(--border2);border-radius:6px;padding:2px 6px;font-size:12px;font-family:monospace;background:var(--surface2)"
                onchange="updateFundNav('${f.code}','${S.acct}',this.value)"
                onclick="event.stopPropagation()">
              元 · ${f.units}單位
            </div>
            <div class="meta" style="margin-top:2px">投入 NT$${f.cost.toLocaleString()}</div>
          </div>
          <div class="sr-r">
            <div class="price" style="font-size:14px">NT$${Math.round(mv).toLocaleString()}</div>

          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;border-top:1px solid var(--border);padding-top:10px">
          <button onclick="openFundAI('${f.code}','${S.acct}')"
            style="flex:1;padding:8px;background:var(--text);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">
            🤖 AI 分析加倉建議
          </button>

      </div>`;
    }).join('') : '<div style="color:var(--text3);font-size:13px;padding:8px 0">尚無基金</div>'}

function runBatchDiag() {
  const btn = document.getElementById('diag-btn');
  if (btn) { btn.textContent = '⏳ 分析中...'; btn.disabled = true; }

  const acc = PF[S.acct] || {stocks:[]};
  const _stocks = acc.stocks || [];
  if (_stocks.length === 0) return;

  const _taiexAI = gP('TAIEX'), _soxAI = gP('^SOX');
  var stockSummary = _stocks.map(function(s,i) {
    var p = gP(s.code);
    var roi = p ? ((p.price-s.cost)/s.cost*100).toFixed(1) : '?';
    var chg = p ? (p.changePct>=0?'+':'')+p.changePct.toFixed(2)+'%' : '—';
    return (i+1)+'. '+s.name+'('+s.code+') 損益'+roi+'% 今日'+chg;
  }).join('\n');

  var batchPrompt = '你是資深台灣股市經理人。今日大盤：加權'+(_taiexAI?(_taiexAI.changePct>=0?'+':'')+_taiexAI.changePct.toFixed(2)+'%':'—')+' 費半'+(_soxAI?(_soxAI.changePct>=0?'+':'')+_soxAI.changePct.toFixed(2)+'%':'—')+'\n\n'
    +'持倉清單：\n'+stockSummary+'\n\n'
    +'請對每支股票給出健診，回覆JSON陣列(只回JSON，不要其他文字)：\n'
    +'[{"code":"代碼","action":"加倉/續抱/觀察/減碼/停損","reason":"理由一句話含基本面或技術面判斷"}]';

  callAI(batchPrompt, function(text) {
    try {
      var clean = text.replace(/```json|```/g,'').trim();
      var diagResults = JSON.parse(clean);
      if (!Array.isArray(diagResults)) throw new Error('not array');
      diagResults.forEach(function(item) {
        var si = _stocks.findIndex(function(s){return s.code===item.code;});
        if (si < 0) return;
        var el = document.getElementById('diag-text-'+si);
        if (el) el.innerHTML = '<b>'+item.action+'</b> — '+item.reason;

// 從 localStorage 讀取自訂 prompt
function getPrompt(key) {
  try {
    const custom = JSON.parse(localStorage.getItem('customPrompts') || '{}');
    return custom[key] || DEFAULT_PROMPTS[key] || '';
  } catch { return DEFAULT_PROMPTS[key] || ''; }
}
function savePrompt(key, val) {
  try {
    const custom = JSON.parse(localStorage.getItem('customPrompts') || '{}');
    custom[key] = val;
    localStorage.setItem('customPrompts', JSON.stringify(custom));
  } catch {}
}
function resetPrompt(key) {
  try {
    const custom = JSON.parse(localStorage.getItem('customPrompts') || '{}');
    delete custom[key];
    localStorage.setItem('customPrompts', JSON.stringify(custom));
  } catch {}
}

  document.getElementById('prompt-editor-modal')?.remove();

// ── 產業個股展開 ─────────────────────────────────────────────
function toggleSectorStocks(id) {
  var el = document.getElementById(id);
  if (!el) return;
  if (el.style.display === 'block') { el.style.display = 'none'; return; }
  el.style.display = 'block';
  if (el.dataset.loaded) return;
  el.dataset.loaded = '1';
  var sector = el.dataset.sector;
  if (!sector) return;

  // 從 TWSE 抓該產業個股
  fetch('https://openapi.twse.com.tw/v1/exchangeReport/MI_INDEX20_ALLBUT0999', {
    signal: AbortSignal.timeout(8000)
  })
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(data) {
    if (!data) { el.textContent = '無法載入個股資料'; return; }
    // 過濾該產業股票
    var stocks = data.filter(function(s){
      return (s.Industry || s.產業別 || '') === sector && s.Code && s.Name;
    });
    // 若 API 無產業欄位，改用全量資料從 S.prices 比對
    if (!stocks.length) {
      // 用已知現價資料列出前10大漲/跌
      var priceList = Object.entries(S.prices || {})
        .filter(function(kv){ return kv[1] && kv[1].price && /^\d{4}$/.test(kv[0]); })
        .map(function(kv){
          var db = STOCK_DB.find(function(s){return s.code===kv[0];});
          return {code:kv[0], name:db?db.name:kv[1].name||kv[0], pct:kv[1].changePct||0};
        })
        .sort(function(a,b){return b.pct-a.pct;})
        .slice(0,10);
      el.innerHTML = priceList.length
        ? priceList.map(function(s,i){
            return '<div style="display:flex;justify-content:space-between">'
              +'<span>'+(i+1)+'. '+s.name+' '+s.code+'</span>'
              +'<span style="color:'+(s.pct>=0?'#86efac':'#fca5a5')+';font-family:monospace">'+(s.pct>=0?'+':'')+s.pct.toFixed(2)+'%</span>'
              +'</div>';
          }).join('')
        : '暫無個股資料';
      return;
    }
    // 排序取前10
    stocks.sort(function(a,b){
      var pa = parseFloat((a.ChangePercent||'0').replace(/[+%]/g,''));
      var pb = parseFloat((b.ChangePercent||'0').replace(/[+%]/g,''));
      return pb - pa;
    });
    el.innerHTML = stocks.slice(0,10).map(function(s,i){
      var pct = parseFloat((s.ChangePercent||'0').replace(/[+%]/g,''));
      var dir = (s.Direction||'+') === '-' ? -1 : 1;
      pct = dir * pct;
      return '<div style="display:flex;justify-content:space-between">'
        +'<span>'+(i+1)+'. '+s.Name+' <span style="opacity:.6">'+s.Code+'</span></span>'
        +'<span style="color:'+(pct>=0?'#86efac':'#fca5a5')+';font-family:monospace">'+(pct>=0?'+':'')+pct.toFixed(2)+'%</span>'
        +'</div>';
    }).join('');
  })
  .catch(function(){ el.textContent = '載入失敗'; });
}

        .replace(/【([^】]+)】/g,'<br><strong style="color:#6b21a8;font-size:11px;letter-spacing:.5px">【$1】</strong><br>')
        .replace(/轉強訊號[：:][^$＄]*[$＄]([0-9,，.]+)/g, function(m,p){ return '<span style="background:#f0fdf4;color:#166534;border-radius:4px;padding:2px 8px;font-weight:700;display:inline-block;margin:1px">🟢 轉強訊號 $'+p.replace(/,|，/g,'')+'</span>'; })
        .replace(/重要壓力[：:][^$＄]*[$＄]([0-9,，.]+)/g, function(m,p){ return '<span style="background:#fef2f2;color:#991b1b;border-radius:4px;padding:2px 8px;font-weight:700;display:inline-block;margin:1px">🔴 重要壓力 $'+p.replace(/,|，/g,'')+'</span>'; })
        .replace(/多頭確認[：:][^$＄]*[$＄]([0-9,，.]+)/g, function(m,p){ return '<span style="background:#eff6ff;color:#1d4ed8;border-radius:4px;padding:2px 8px;font-weight:700;display:inline-block;margin:1px">🔵 多頭確認 $'+p.replace(/,|，/g,'')+'</span>'; });
        },
        function(){
          var el=document.getElementById('diag-result');
          if(el)el.innerHTML='<span style="color:var(--text3)">AI分析失敗，請稍後重試</span>';
        }
      );
    }

    // 先抓 K 線，再做分析
    fetch('/api/kline?code='+s.code, {signal: AbortSignal.timeout(8000)})
      .then(function(r){ return r.json(); })
      .then(function(kl){ runDiag(kl); })
      .catch(function(){ runDiag(null); });
  })();
}

function selectType(type) {
  document.getElementById('ft').value = type;
  ['stock','etf','fund'].forEach(t => {
    const el = document.getElementById('type-'+t);
    if (t === type) {
      el.style.border = '2px solid var(--text)';
      el.style.background = 'var(--text)';
      el.style.color = '#fff';
    } else {
      el.style.border = '2px solid var(--border2)';
      el.style.background = 'transparent';
      el.style.color = 'var(--text)';
    }
  });
  // 基金時隱藏搜尋清單
  document.getElementById('stock-fields').style.display = type === 'fund' ? 'none' : 'block';
  document.getElementById('fund-fields').style.display  = type === 'fund' ? 'block' : 'none';
  // 篩選清單只顯示對應類型
  if (type !== 'fund') filterStocks();
}

function filterStocks() {
  const q    = (document.getElementById('fsearch')?.value || '').toLowerCase();
  const type = document.getElementById('ft').value;
  const clear = document.getElementById('search-clear');
  if (clear) clear.style.display = q ? 'block' : 'none';

  const filtered = STOCK_DB.filter(s => {
    const matchType = type === 'stock' ? s.type === 'stock' : type === 'etf' ? s.type === 'etf' : true;
    const matchQ    = !q || s.code.toLowerCase().includes(q) || s.name.toLowerCase().includes(q);
    return matchType && matchQ;
  });

  const list = document.getElementById('stock-list');
  if (!list) return;
  list.innerHTML = filtered.map(s => `
    <div class="stock-item" onclick="selectStock('${s.code}','${s.name}','${s.type}')">
      <div><span class="si-name">${s.name}</span></div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="si-code">${s.code}</span>
        <span class="si-type ${s.type==='etf'?'si-etf':'si-stock'}">${s.type==='etf'?'ETF':'個股'}</span>
      </div>
    </div>`).join('') || '<div style="padding:12px;color:var(--text3);font-size:13px;text-align:center">找不到，請直接輸入代碼</div>';
}

function clearSearch() {
  const s = document.getElementById('fsearch');
  if (s) { s.value = ''; filterStocks(); s.focus(); }
}

function selectStock(code, name, type) {
  // 填入欄位
  const fc = document.getElementById('fc');
  const fn = document.getElementById('fn');
  if (fc) fc.value = code;
  if (fn) fn.value = name;
  // 更新類型
  selectType(type);
  // 更新已選擇顯示
  const sel = document.getElementById('selected-stock');
  if (sel) {
    sel.style.color = 'var(--text)';
    sel.innerHTML = `<strong>${name}</strong> <span style="color:var(--text3);font-family:monospace">${code}</span>
      <span class="si-type ${type==='etf'?'si-etf':'si-stock'}" style="margin-left:6px">${type==='etf'?'ETF':'個股'}</span>`;
  }
  // 清空搜尋框，收起清單
  const fs = document.getElementById('fsearch');
  if (fs) fs.value = name;
  filterStocks();
}

function toggleFundFields() {
  const type = document.getElementById('ft').value;
  document.getElementById('stock-fields').style.display = type === 'fund' ? 'none' : 'block';
  document.getElementById('fund-fields').style.display  = type === 'fund' ? 'block' : 'none';
}

function doAdd() {
  const type = document.getElementById('ft').value;
  const acct = document.getElementById('fa').value;
  const name = document.getElementById('fn').value.trim();
  if (!name) { alert('請填寫名稱'); return; }
  if (!PF[acct]) PF[acct] = {stocks:[], funds:[]};

  if (type === 'fund') {
    const cost  = parseFloat(document.getElementById('fcost_total').value);
    const units = parseFloat(document.getElementById('funits').value);
    const nav   = parseFloat(document.getElementById('fnav').value);
    if (isNaN(cost)||isNaN(units)||isNaN(nav)) { alert('請填寫完整基金資訊'); return; }
    const code = 'FUND_' + Date.now();
    PF[acct].funds = PF[acct].funds || [];
    PF[acct].funds.push({code, name, type:'fund', cost, units, nav});
  } else {
    const code = document.getElementById('fc').value.trim().toUpperCase();
    const costPer = parseFloat(document.getElementById('fco').value);
    const qty  = parseInt(document.getElementById('fq').value);
    if (!code||isNaN(costPer)||isNaN(qty)) { alert('請填寫完整資訊'); return; }
    PF[acct].stocks = PF[acct].stocks || [];
    PF[acct].stocks.push({code, name, type, cost:costPer, qty, account:acct});
  }
  savePF();
  document.getElementById('modal').remove();
  S.acct = acct; renderTabs(); go('portfolio');
}

function deleteFund(code, acct) {
  if (!confirm('確定要刪除這筆基金？')) return;
  if (!PF[acct]?.funds) return;
  PF[acct].funds = PF[acct].funds.filter(f => f.code !== code);
  savePF(); renderPage(S.page);
}

function updateFundNav(code, acct, val) {
  const nav = parseFloat(val);
  if (isNaN(nav) || nav <= 0) return;
  const fund = (PF[acct]?.funds || []).find(f => f.code === code);
  if (!fund) return;
  fund.nav = nav;
  savePF();
  renderPage(S.page); // 重新渲染讓損益即時更新
}

function openFundAI(code, acct) {
  const fund = (PF[acct]?.funds || []).find(f => f.code === code);
  if (!fund) return;

  // 建立 AI 分析 overlay
  document.getElementById('fund-ai-modal')?.remove();
  const el = document.createElement('div');
  el.className = 'overlay'; el.id = 'fund-ai-modal';
  const mv   = fund.nav * fund.units;
  const roi  = fund.cost > 0 ? ((mv - fund.cost) / fund.cost * 100).toFixed(1) : 0;
  const pnl  = Math.round(mv - fund.cost);

  el.innerHTML = `<div class="sheet" style="max-height:80vh;overflow-y:auto">
    <div class="handle"></div>
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">🤖 AI 基金分析</div>

    <div style="background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:16px;font-size:13px;line-height:1.8">
      <div>📊 投入金額：NT$${fund.cost.toLocaleString()}</div>
      <div>💰 目前市值：NT$${Math.round(mv).toLocaleString()}</div>
      <div>📈 未實現損益：<span class="${pnl>=0?'up':'dn'}">${pnl>=0?'+':''}${roi}% (${pnl>=0?'+':''}NT$${Math.abs(pnl).toLocaleString()})</span></div>
      <div>📋 淨值：$${fund.nav} × ${fund.units}單位</div>
    </div>
    <div id="fund-ai-result" style="font-size:13px;line-height:1.85;color:var(--text);min-height:80px">
      <div style="text-align:center;padding:20px;color:var(--text3)">⏳ AI 分析中...</div>
    </div>
    <button class="btn-o" style="margin-top:16px" onclick="document.getElementById('fund-ai-modal').remove()">關閉</button>
  </div>`;
  el.addEventListener('click', e => { if(e.target===el) el.remove(); });

    [costEl, qtyEl].forEach(inp => inp?.addEventListener('input', () => {

      if (prev && !isNaN(c) && !isNaN(q)) prev.textContent = Math.round(c*q).toLocaleString();
    }));

function doEdit(code, acct) {
  const cost = parseFloat(document.getElementById('edit-cost')?.value);
  const qty  = parseInt(document.getElementById('edit-qty')?.value);
  if (isNaN(cost) || isNaN(qty) || cost <= 0 || qty <= 0) {
    alert('請填寫正確的成本和股數'); return;
  }
  const s = (PF[acct]?.stocks || []).find(x => x.code === code);
  if (!s) return;
  s.cost = cost;
  s.qty  = qty;
  savePF();
  document.getElementById('edit-modal')?.remove();
  renderPage(S.page);
}

function deleteStock(code, acct) {
  if (!confirm(`確定要刪除 ${code}？`)) return;
  if (!PF[acct]?.stocks) return;
  PF[acct].stocks = PF[acct].stocks.filter(s => s.code !== code);
  savePF();
  renderPage(S.page);
}

// ─── 動態載入完整股票清單(TWSE + TPEx OpenAPI，從瀏覽器直接呼叫)───────
async function loadFullStockDB() {
  // 建立現有 STOCK_DB 的 code set，避免重複
  const existing = new Set(STOCK_DB.map(s => s.code));

  try {
    // 同時抓上市(TWSE)和上櫃(TPEx)
    const [twseRes, tpexRes] = await Promise.allSettled([
      fetch('https://openapi.twse.com.tw/v1/opendata/t187ap03_L', {
        headers: { 'Accept': 'application/json' },
        signal: AbortSignal.timeout(8000)
      }),
      fetch('https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O', {
        headers: { 'Accept': 'application/json' },
        signal: AbortSignal.timeout(8000)
      })
    ]);

    let added = 0;

    // 上市股票
    if (twseRes.status === 'fulfilled' && twseRes.value.ok) {
      const data = await twseRes.value.json();
      data.forEach(item => {
        const code = item['有價證券代號']?.trim();
        const name = item['有價證券名稱']?.trim();
        if (!code || !name || existing.has(code)) return;
        if (!/^\d{4,6}$/.test(code)) return; // 只要純數字代號
        STOCK_DB.push({ code, name, type: 'stock' });
        existing.add(code);
        added++;
      });
    }

    // 上櫃股票
    if (tpexRes.status === 'fulfilled' && tpexRes.value.ok) {
      const data = await tpexRes.value.json();
      data.forEach(item => {
        const code = item['SecuritiesCompanyCode']?.trim() || item['有價證券代號']?.trim();
        const name = item['CompanyName']?.trim() || item['有價證券名稱']?.trim();
        if (!code || !name || existing.has(code)) return;
        if (!/^\d{4,6}$/.test(code)) return;
        STOCK_DB.push({ code, name, type: 'stock' });
        existing.add(code);
        added++;
      });
    }

    if (added > 0) {
      // 按代號排序
      STOCK_DB.sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
      console.log('[STOCK_DB] 動態載入完成，新增', added, '支，總計', STOCK_DB.length, '支');
      // 更新 AI 選股的名稱校正 map
      if (typeof window._stockDbMap !== 'undefined') {
        STOCK_DB.forEach(s => { window._stockDbMap[s.code] = s.name; });
      }
    }
  } catch(e) {
    console.log('[STOCK_DB] 動態載入失敗，使用內建清單', e.message);
  }
}

  loadFullStockDB();

  // ── 每天早上 8:00 自動刷新新聞 ──────────────────────────────────
  function scheduleNewsRefresh() {
    const now = new Date();
    const next = new Date();
    next.setHours(8, 0, 0, 0);
    // 如果今天 8:00 已過，設定明天 8:00
    if (now >= next) next.setDate(next.getDate() + 1);
    const msUntil = next - now;
    setTimeout(function() {
      // 到 8:00 了，刷新新聞
      console.log('[新聞] 早上8:00自動刷新');
      if (S.page === 'news') renderNews();
      // 設定之後每24小時再刷一次
      setInterval(function() {
        if (S.page === 'news') renderNews();
      }, 24 * 60 * 60 * 1000);
    }, msUntil);
    const h = Math.floor(msUntil / 3600000);
    const m = Math.floor((msUntil % 3600000) / 60000);
    console.log('[新聞] 下次自動更新：' + h + '小時' + m + '分後(早上8:00)');
  }
  scheduleNewsRefresh();
})();
